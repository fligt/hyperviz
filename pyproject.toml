[project]
name = "hyperviz"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Frank Ligterink", email = "frank.ligterink@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dash>=4.4.1",
    "dash-daq>=0.6.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "tomlkit>=0.15.1",
]

[project.scripts]
hyperviz = "hyperviz:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fairdatanow>=0.2.23",
    "ipykernel>=7.3.0",
    "jupyter-bokeh>=4.1.0",
    "jupytext>=1.19.5",
    "nbclient>=0.11.0",
    "pip>=26.2.1",
    "ruff>=0.16.8",
]

[tool.jupytext]
formats = "ipynb,qmd"
